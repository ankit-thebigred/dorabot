<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2338"/>
      <stop offset="1" stop-color="#0A0E18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#3FD0FF" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#3FD0FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3FD0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7BE3FF"/>
      <stop offset="1" stop-color="#2E8BFF"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>
  <circle cx="512" cy="512" r="330" fill="url(#glow)"/>
  <!-- orb ring with a gap at top-right, like a live status arc -->
  <circle cx="512" cy="512" r="268" fill="none" stroke="url(#ring)" stroke-width="30" stroke-linecap="round"
          stroke-dasharray="1530 154" transform="rotate(-62 512 512)"/>
  <circle cx="512" cy="512" r="226" fill="none" stroke="#7BE3FF" stroke-opacity="0.18" stroke-width="4"/>
  <!-- status light in the gap -->
  <circle cx="565" cy="250" r="22" fill="#FF5A4E"/>
  <circle cx="565" cy="250" r="40" fill="#FF5A4E" fill-opacity="0.18"/>
  <text x="512" y="588" text-anchor="middle" font-family="Helvetica Neue" font-weight="bold" font-size="236" letter-spacing="-6" fill="#F2F6FF">R2</text>
</svg>
